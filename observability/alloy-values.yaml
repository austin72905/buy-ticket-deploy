# Values for the official Grafana Alloy Helm chart.
# Chart: grafana/alloy
# Usage:
#   helm upgrade --install alloy grafana/alloy -n observability -f observability/alloy-values.yaml

controller:
  type: deployment
  replicas: 1

rbac:
  create: true

serviceAccount:
  create: true

alloy:
  enableReporting: false
  configMap:
    create: true
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "buy_ticket_api" {
        targets = discovery.kubernetes.pods.targets

        rule {
          action        = "keep"
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "buy-ticket"
        }

        rule {
          action        = "keep"
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          regex         = "api"
        }

        rule {
          action        = "drop"
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Succeeded|Failed"
        }

        rule {
          action        = "replace"
          source_labels = ["__meta_kubernetes_pod_ip"]
          regex         = "(.+)"
          replacement   = "${1}:8080"
          target_label  = "__address__"
        }

        rule {
          action       = "replace"
          replacement  = "buy-ticket-api"
          target_label = "service_name"
        }

        rule {
          action        = "replace"
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          action        = "replace"
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          action        = "replace"
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }

        rule {
          action        = "replace"
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          target_label  = "component"
        }

        rule {
          action        = "replace"
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
          target_label  = "release"
        }
      }

      pyroscope.scrape "buy_ticket_api" {
        targets         = discovery.relabel.buy_ticket_api.output
        scrape_interval = "15s"
        forward_to      = [pyroscope.write.local.receiver]
      }

      pyroscope.write "local" {
        endpoint {
          url = "http://pyroscope.observability.svc.cluster.local:4040"
        }
      }